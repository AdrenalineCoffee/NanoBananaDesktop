name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  release-guard:
    name: Release Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh \
            | sh -s -- -b /usr/local/bin v8.24.3

      - name: Run release guard checks
        run: bash scripts/release_guard.sh --ci

  swift-test:
    name: Swift Test
    runs-on: macos-14
    needs:
      - release-guard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test
