name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  release-guard:
    name: Release Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          VERSION="8.24.3"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) ASSET="gitleaks_${VERSION}_linux_x64.tar.gz" ;;
            aarch64|arm64) ASSET="gitleaks_${VERSION}_linux_arm64.tar.gz" ;;
            *) echo "Unsupported architecture: $ARCH" && exit 1 ;;
          esac
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${ASSET}" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run release guard checks
        run: bash scripts/release_guard.sh --ci

  swift-test:
    name: Swift Test
    runs-on: macos-14
    needs:
      - release-guard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test
